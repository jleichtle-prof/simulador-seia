<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador SEIA - Chile</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --panel-hover: #1f2937;
            --border: #374151;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* COLUMNA IZQUIERDA - ESTILO ORIGINAL */
        .sidebar {
            width: 320px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .progress-box {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            background-color: #1f2937;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        /* CAJAS DE LA IZQUIERDA (CON ANIMACIÓN AL APARECER) */
        .step-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .step-box:hover {
            background-color: var(--panel-hover);
            border-color: var(--text-muted);
        }

        .step-box.active {
            border-color: var(--primary);
            background-color: rgba(37, 99, 235, 0.1);
        }

        .step-box.completed {
            border-color: var(--success);
        }

        .step-badge {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background-color: #1f2937;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step-box.completed .step-badge {
            background-color: var(--success);
            color: #fff;
        }

        .step-box.active .step-badge {
            background-color: var(--primary);
            color: #fff;
        }

        .step-details {
            display: flex;
            flex-direction: column;
        }

        .step-tag {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .step-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* ÁREA PRINCIPAL */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-header {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel);
        }

        .score-box {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .content {
            padding: 40px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.4rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-desc {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .grid-options {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .option-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .feedback.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: #34d399;
        }

        .feedback.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #f87171;
            color: #f87171;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- COLUMNA IZQUIERDA -->
    <aside class="sidebar">
        <div class="brand">🌲 Simulador SEIA</div>
        <div class="subtitle">Evaluación de Impacto Ambiental</div>

        <div class="progress-box">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                <span id="stepCounter">Etapa 1 de 13</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Las cajas se cargan dinámicamente según el avance -->
        <div class="steps-container" id="sidebarSteps"></div>
    </aside>

    <!-- ÁREA DE TRABAJO -->
    <main class="main">
        <header class="top-header">
            <span id="currentPhaseTag" style="font-size: 0.85rem; font-weight: 700; color: var(--accent);">SEIA</span>
            <div class="score-box" id="scoreBadge">0 / 100 pts</div>
        </header>

        <section class="content" id="stageContent"></section>
    </main>

    <script>
        // ESTADO DE LA APLICACIÓN
        const state = {
            currentStage: 1,
            maxUnlockedStage: 1, // Controla cuántas cajas son visibles a la izquierda
            score: 0,
            completedStages: new Set(),
            awardedScores: new Set()
        };

        // LISTA DE ETAPAS
        const stages = [
            { id: 1, title: "Antecedentes del Proyecto", phase: "SEIA", icon: "📄" },
            { id: 2, title: "¿Debe ingresar al SEIA?", phase: "SEIA", icon: "🔎" },
            { id: 3, title: "¿DIA o EIA?", phase: "SEIA", icon: "📑" },
            { id: 4, title: "Componente Fauna", phase: "SEIA", icon: "🦊" },
            { id: 5, title: "Impacto Ambiental", phase: "SEIA", icon: "📈" },
            { id: 6, title: "Línea de Base", phase: "SEIA", icon: "🔭" },
            { id: 7, title: "Normativa y PAS", phase: "SEIA", icon: "⚖️" },
            { id: 8, title: "Medidas Ambientales", phase: "SEIA", icon: "🌱" },
            { id: 9, title: "Pronunciamiento Técnico", phase: "SEIA", icon: "📋" },
            { id: 10, title: "Resolución RCA", phase: "RCA", icon: "✅" },
            { id: 11, title: "Construcción y Operación", phase: "SMA", icon: "🏗️" },
            { id: 12, title: "Fiscalización SMA", phase: "SMA", icon: "🔍" },
            { id: 13, title: "Cumplimiento y Hallazgos", phase: "SMA", icon: "⚠️" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadStage(1);
        });

        // GENERA LAS CAJAS IZQUIERDAS (OCULTA LAS NO LIBERADAS)
        function renderSidebar() {
            const container = document.getElementById("sidebarSteps");

            // FILTRO: Muestra únicamente las cajas hasta maxUnlockedStage
            const visibleStages = stages.filter(s => s.id <= state.maxUnlockedStage);

            container.innerHTML = visibleStages.map(s => {
                const isCompleted = state.completedStages.has(s.id);
                const isActive = s.id === state.currentStage;

                return `
                    <div class="step-box ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" 
                         onclick="goToStage(${s.id})">
                        <div class="step-badge">${isCompleted ? '✓' : s.id}</div>
                        <div class="step-details">
                            <span class="step-tag">${s.phase}</span>
                            <span class="step-name">${s.title}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Actualiza la barra de progreso general
            const pct = Math.round((state.completedStages.size / stages.length) * 100);
            document.getElementById("progressBar").style.width = `${pct}%`;
            document.getElementById("progressPercent").innerText = `${pct}%`;
            document.getElementById("stepCounter").innerText = `Etapa ${state.currentStage} de ${stages.length}`;
            document.getElementById("scoreBadge").innerText = `${state.score} / 100 pts`;
        }

        function goToStage(stageId) {
            if (stageId <= state.maxUnlockedStage) {
                state.currentStage = stageId;
                renderSidebar();
                loadStage(stageId);
            }
        }

        // LIBERA LA SIGUIENTE CAJA Y AVANZA
        function completeAndNext(stageId) {
            state.completedStages.add(stageId);

            // Desbloquea la caja siguiente en la izquierda
            if (stageId + 1 > state.maxUnlockedStage && stageId < stages.length) {
                state.maxUnlockedStage = stageId + 1;
            }

            if (stageId < stages.length) {
                goToStage(stageId + 1);
            } else {
                renderSidebar();
            }
        }

        function addScore(points, key) {
            if (!state.awardedScores.has(key)) {
                state.score += points;
                state.awardedScores.add(key);
            }
        }

        // CARGA EL CONTENIDO EN EL ÁREA CENTRAL
        function loadStage(stageId) {
            const container = document.getElementById("stageContent");
            const currentObj = stages.find(s => s.id === stageId);
            document.getElementById("currentPhaseTag").innerText = currentObj.phase;

            switch (stageId) {
                case 1:
                    container.innerHTML = `
                        <div class="card">
                            <h2 class="card-title">📄 Antecedentes del Proyecto</h2>
                            <p class="card-desc">
                                Se planifica la instalación de un Parque Fotovoltaico de 12 MW con una línea de evacuación eléctrica de 3 km en la Región del Maule.
                            </p>
                            <button class="btn" onclick="addScore(10, 's1'); completeAndNext(1);">
                                Iniciar Evaluación Técnica →
                            </button>
                        </div>
                    `;
                    break;

                case 2:
                    container.innerHTML = `
                        <div class="card">
                            <h2 class="card-title">🔎 ¿Debe ingresar al SEIA?</h2>
                            <p class="card-desc">
                                Evaluando la tipología del proyecto según el Art. 10 de la Ley 19.300 (letra c: centrales generadoras de energía mayores a 3 MW).
                            </p>
                            <div class="grid-options">
                                <div class="option-item" onclick="evaluarIngreso(true)">
                                    <strong>Sí, debe ingresar obligatoriamente</strong>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Supera el umbral de 3 MW de potencia instalada.</p>
                                </div>
                                <div class="option-item" onclick="evaluarIngreso(false)">
                                    <strong>No, es de ingreso voluntario</strong>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Las energías renovables no requieren evaluación.</p>
                                </div>
                            </div>
                            <div id="fb2" class="feedback"></div>
                        </div>
                    `;
                    break;

                case 3:
                    container.innerHTML = `
                        <div class="card">
                            <h2 class="card-title">📑 ¿DIA o EIA?</h2>
                            <p class="card-desc">
                                Se ha detectado la presencia de fauna en categoría de conservación vulnerable que será intervenida por el trazado de la línea (Art. 11 Ley 19.300).
                            </p>
                            <div class="grid-options">
                                <div class="option-item" onclick="evaluarVia('DIA')">
                                    <strong>Declaración de Impacto Ambiental (DIA)</strong>
                                </div>
                                <div class="option-item" onclick="evaluarVia('EIA')">
                                    <strong>Estudio de Impacto Ambiental (EIA)</strong>
                                </div>
                            </div>
                            <div id="fb3" class="feedback"></div>
                        </div>
                    `;
                    break;

                case 4:
                    container.innerHTML = `
                        <div class="card">
                            <h2 class="card-title">🦊 Componente Fauna en Línea de Base</h2>
                            <p class="card-desc">
                                Durante las exploraciones previas en la zona del proyecto se detectó presencia de avifauna migratoria y micromamíferos nativos. Según las guías metodológicas del Servicio de Evaluación Ambiental (SEA), ¿cuál es el estándar correcto para el muestreo de este componente?
                            </p>
                            <div class="grid-options">
                                <div class="option-item" onclick="evaluarFauna(false)">
                                    <strong>Una única campaña en verano</strong>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Solo muestrear en la época de mayor actividad de las especies.</p>
                                </div>
                                <div class="option-item" onclick="evaluarFauna(true)">
                                    <strong>Campañas estacionales representativas (mínimo 2 estaciones)</strong>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Utilizando transectos, trampas Sherman y fototrampeo acorde a guías SEA.</p>
                                </div>
                                <div class="option-item" onclick="evaluarFauna(false)">
                                    <strong>Revisiones bibliográficas únicamente</strong>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Usar datos de proyectos colindantes sin levantar datos primarios en terreno.</p>
                                </div>
                            </div>
                            <div id="fb4" class="feedback"></div>
                        </div>
                    `;
                    break;

                default:
                    container.innerHTML = `
                        <div class="card">
                            <h2 class="card-title">${currentObj.icon} ${currentObj.title}</h2>
                            <p class="card-desc">Módulo en desarrollo para la etapa ${stageId}.</p>
                            <button class="btn" onclick="completeAndNext(${stageId})">Avanzar →</button>
                        </div>
                    `;
                    break;
            }
        }

        // LÓGICA DE INTERACCIÓN
        function evaluarIngreso(esCorrecto) {
            const fb = document.getElementById("fb2");
            fb.style.display = "block";

            if (esCorrecto) {
                fb.className = "feedback success";
                fb.innerHTML = `
                    <strong>¡Correcto! (+15 pts)</strong><br>
                    Al tener 12 MW (> 3 MW), ingresa obligatoriamente.<br><br>
                    <button class="btn" onclick="completeAndNext(2)">Avanzar a Vía de Evaluación →</button>
                `;
                addScore(15, 's2');
            } else {
                fb.className = "feedback error";
                fb.innerHTML = "<strong>Incorrecto.</strong> El proyecto supera el límite de 3 MW, por lo que debe ingresar obligatoriamente.";
            }
        }

        function evaluarVia(opcion) {
            const fb = document.getElementById("fb3");
            fb.style.display = "block";

            if (opcion === 'EIA') {
                fb.className = "feedback success";
                fb.innerHTML = `
                    <strong>¡Correcto! (+20 pts)</strong><br>
                    Al afectar fauna en conservación (Art. 11), debe evaluarse mediante un <strong>EIA</strong>.<br><br>
                    <button class="btn" onclick="completeAndNext(3)">Avanzar al Análisis de Fauna →</button>
                `;
                addScore(20, 's3');
            } else {
                fb.className = "feedback error";
                fb.innerHTML = "<strong>Incorrecto.</strong> Al haber un impacto significativo sobre especies protegidas, una DIA no es suficiente.";
            }
        }

        function evaluarFauna(esCorrecto) {
            const fb = document.getElementById("fb4");
            fb.style.display = "block";

            if (esCorrecto) {
                fb.className = "feedback success";
                fb.innerHTML = `
                    <strong>¡Correcto! (+15 pts)</strong><br>
                    El SEA exige caracterizar la variabilidad temporal de la fauna mediante levantamiento de información primaria en terreno en las estaciones críticas del año.<br><br>
                    <button class="btn" onclick="completeAndNext(4)">Avanzar a Evaluación de Impacto Ambiental →</button>
                `;
                addScore(15, 's4');
            } else {
                fb.className = "feedback error";
                fb.innerHTML = "<strong>Incorrecto.</strong> La caracterización de fauna requiere datos de terreno representativos de las distintas estaciones climáticas para determinar abundancia y riqueza de especies.";
            }
        }
    </script>
</body>
</html>
