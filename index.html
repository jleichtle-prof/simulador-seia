<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Evaluación & Fiscalización Ambiental | SEIA & SMA Chile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --brand-navy: #0f2d39;
    --brand-teal: #1e707e;
    --brand-teal-light: #e8f4f5;
    
    --seia-blue: #2563eb;
    --seia-bg: #eff6ff;
    
    --rca-green: #16a34a;
    --rca-bg: #f0fdf4;
    
    --sma-orange: #ea580c;
    --sma-bg: #fff7ed;
    
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --surface-bg: #f8fafc;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px -2px rgba(15, 45, 57, 0.08);
    --shadow-lg: 0 12px 28px -4px rgba(15, 45, 57, 0.12);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    background-color: var(--surface-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ================= HEADER ================= */
header {
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 50;
}

.header-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
}

.brand-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--brand-navy), var(--brand-teal));
    color: white;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 10px rgba(30, 112, 126, 0.25);
}

.brand-info h1 {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--brand-navy);
    line-height: 1.2;
}

.brand-info p {
    font-size: 0.825rem;
    color: var(--text-muted);
}

.badges-group {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.badge {
    padding: 0.35rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
}

.badge-seia { background: var(--seia-bg); color: var(--seia-blue); border-color: #bfdbfe; }
.badge-sma { background: var(--sma-bg); color: var(--sma-orange); border-color: #ffedd5; }

/* ================= LAYOUT ================= */
.main-layout {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
    flex: 1;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 1.5rem;
    align-items: start;
}

/* ================= BARRA DE PROGRESO ================= */
.progress-card {
    background: white;
    border-radius: 16px;
    padding: 1.25rem;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.25rem;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    font-weight: 700;
}

.progress-track {
    height: 10px;
    background: var(--surface-bg);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--brand-teal), var(--rca-green));
    transition: width 0.4s ease;
}

.score-badge {
    background: var(--brand-teal-light);
    color: var(--brand-teal);
    padding: 0.25rem 0.6rem;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 800;
}

/* ================= STEPS SIDEBAR ================= */
.sidebar-steps {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: calc(100vh - 210px);
    overflow-y: auto;
    padding-right: 0.25rem;
}

.step-item {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.85rem 1rem;
    background: white;
    border: 1.5px solid var(--border-color);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    width: 100%;
}

.step-item:hover {
    border-color: var(--brand-teal);
    transform: translateX(2px);
}

.step-item.active {
    border-color: var(--brand-teal);
    background: var(--brand-teal-light);
    box-shadow: var(--shadow-sm);
}

.step-item.completed {
    border-color: #cbd5e1;
    background: #f8fafc;
    opacity: 0.85;
}

.step-item.completed .step-number {
    background: var(--rca-green);
    color: white;
}

.step-number {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 800;
    display: grid;
    place-items: center;
    flex-shrink: 0;
}

.step-info {
    flex: 1;
    min-width: 0;
}

.step-title {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
}

.step-phase {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
}

/* ================= WORKSPACE (PANEL DERECHO) ================= */
.workspace-panel {
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: var(--shadow-md);
    min-height: 600px;
    position: sticky;
    top: 90px;
}

.workspace-header {
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.workspace-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--brand-teal-light);
    display: grid;
    place-items: center;
    font-size: 1.6rem;
    flex-shrink: 0;
}

.workspace-title h2 {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--brand-navy);
}

.workspace-title p {
    font-size: 0.9rem;
    color: var(--text-muted);
}

/* ================= COMPONENTES DE CONTENIDO ================= */
.data-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin: 1.25rem 0;
}

.data-card {
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
    padding: 1rem;
    border-radius: 12px;
}

.data-card strong {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
}

.data-card span {
    font-size: 1rem;
    font-weight: 700;
    color: var(--brand-navy);
}

.highlight-box {
    background: #f0fdf4;
    border-left: 4px solid var(--rca-green);
    border-radius: 0 12px 12px 0;
    padding: 1.25rem;
    margin: 1.25rem 0;
}

.highlight-box h4 {
    color: var(--rca-green);
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
}

.decision-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 1.5rem;
}

.btn-decision {
    background: white;
    border: 2px solid var(--border-color);
    border-radius: 14px;
    padding: 1.25rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-decision:hover {
    border-color: var(--brand-teal);
    background: var(--brand-teal-light);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
}

.btn-decision strong {
    display: block;
    font-size: 1rem;
    color: var(--brand-navy);
    margin-bottom: 0.25rem;
}

.btn-decision small {
    color: var(--text-muted);
    font-size: 0.825rem;
}

.feedback-box {
    padding: 1.25rem;
    border-radius: 12px;
    margin-top: 1.5rem;
    font-size: 0.925rem;
    line-height: 1.5;
}

.feedback-box.correct {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
}

.feedback-box.wrong {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
}

.btn-primary {
    background: var(--brand-navy);
    color: white;
    border: none;
    padding: 0.85rem 1.75rem;
    border-radius: 10px;
    font-size: 0.925rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1.5rem;
    transition: background 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-primary:hover {
    background: var(--brand-teal);
}

/* RESPONSIVE */
@media (max-width: 992px) {
    .main-layout {
        grid-template-columns: 1fr;
    }
    .workspace-panel {
        position: static;
        min-height: auto;
    }
    .sidebar-steps {
        max-height: 250px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-container">
        <div class="brand">
            <div class="brand-icon">🌿</div>
            <div class="brand-info">
                <h1>Evaluación & Fiscalización Ambiental</h1>
                <p>Simulador Interactivo de Tramitación SEIA y Control SMA</p>
            </div>
        </div>
        <div class="badges-group">
            <span class="badge badge-seia">SEIA · Ley 19.300</span>
            <span class="badge badge-sma">Fiscalización SMA</span>
            <span class="badge">Fauna Silvestre</span>
        </div>
    </div>
</header>

<main class="main-layout">
    <!-- PANEL IZQUIERDO: PROGRESO Y ETAPAS -->
    <aside>
        <div class="progress-card">
            <div class="progress-header">
                <span id="stepCounter">Etapa 1 de 13</span>
                <span id="scoreBadge" class="score-badge">0 / 100 pts</span>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="sidebarSteps" class="sidebar-steps">
            <!-- Renderizado dinámicamente -->
        </div>
    </aside>

    <!-- PANEL DERECHO: ESPACIO DE TRABAJO -->
    <section class="workspace-panel">
        <div id="workspaceHeader" class="workspace-header">
            <!-- Renderizado dinámicamente -->
        </div>
        
        <div id="workspaceContent">
            <!-- Contenido interactivo dinámico -->
        </div>
    </section>
</main>

<script>
// ESTADO DE LA APLICACIÓN
const state = {
    currentStage: 1,
    score: 0,
    completedStages: new Set(),
    awardedScores: new Set()
};

// CONFIGURACIÓN DE ETAPAS
const stages = [
    { id: 1, title: "Antecedentes del Proyecto", phase: "SEIA", icon: "📄" },
    { id: 2, title: "¿Debe ingresar al SEIA?", phase: "SEIA", icon: "🔎" },
    { id: 3, title: "¿DIA o EIA?", phase: "SEIA", icon: "📑" },
    { id: 4, title: "Componente Fauna", phase: "SEIA", icon: "🦊" },
    { id: 5, title: "Impactos Ambiental", phase: "SEIA", icon: "📈" },
    { id: 6, title: "Línea de Base", phase: "SEIA", icon: "🔭" },
    { id: 7, title: "Normativa y PAS", phase: "SEIA", icon: "⚖️" },
    { id: 8, title: "Medidas Ambientales", phase: "SEIA", icon: "🌱" },
    { id: 9, title: "Pronunciamiento Técnico", phase: "SEIA", icon: "📋" },
    { id: 10, title: "Resolución RCA", phase: "RCA", icon: "✅" },
    { id: 11, title: "Construcción y Operación", phase: "SMA", icon: "🏗️" },
    { id: 12, title: "Fiscalización SMA", phase: "SMA", icon: "🔍" },
    { id: 13, title: "Cumplimiento y Hallazgos", phase: "SMA", icon: "⚠️" }
];

// INICIALIZACIÓN
document.addEventListener("DOMContentLoaded", () => {
    renderSidebar();
    loadStage(1);
});

function renderSidebar() {
    const container = document.getElementById("sidebarSteps");
    container.innerHTML = stages.map(s => `
        <button class="step-item ${s.id === state.currentStage ? 'active' : ''} ${state.completedStages.has(s.id) ? 'completed' : ''}" 
                onclick="goToStage(${s.id})">
            <div class="step-number">${state.completedStages.has(s.id) ? '✓' : s.id}</div>
            <div class="step-info">
                <span class="step-phase">${s.phase}</span>
                <span class="step-title">${s.title}</span>
            </div>
        </button>
    `).join('');

    // Actualizar barra de progreso
    const progress = Math.round((state.completedStages.size / stages.length) * 100);
    document.getElementById("progressBar").style.width = `${progress}%`;
    document.getElementById("stepCounter").innerText = `Etapa ${state.currentStage} de ${stages.length}`;
    document.getElementById("scoreBadge").innerText = `${state.score} / 100 pts`;
}

function goToStage(stageId) {
    state.currentStage = stageId;
    renderSidebar();
    loadStage(stageId);
}

function addScore(points, key) {
    if (!state.awardedScores.has(key)) {
        state.score += points;
        state.awardedScores.add(key);
        renderSidebar();
    }
}

// CREADOR DE PLANTILLAS DE ETAPA
function loadStage(id) {
    const header = document.getElementById("workspaceHeader");
    const content = document.getElementById("workspaceContent");
    const stage = stages.find(s => s.id === id);

    header.innerHTML = `
        <div class="workspace-icon">${stage.icon}</div>
        <div class="workspace-title">
            <h2>${stage.id}. ${stage.title}</h2>
            <p>Fase de proceso: ${stage.phase}</p>
        </div>
    `;

    switch(id) {
        case 1:
            content.innerHTML = `
                <p>Una empresa proyecta construir y operar el <strong>Parque Solar Quebrada del Zorro</strong> en la Región de Coquimbo.</p>
                
                <div class="data-grid">
                    <div class="data-card"><strong>Potencia Instalada</strong><span>82 MW</span></div>
                    <div class="data-card"><strong>Superficie</strong><span>145 ha</span></div>
                    <div class="data-card"><strong>Línea Eléctrica</strong><span>110 kV (18 km)</span></div>
                    <div class="data-card"><strong>Vegetación Nativa</strong><span>31 ha a intervenir</span></div>
                </div>

                <div class="highlight-box">
                    <h4>🦎 Antecedentes Relevantes de Fauna</h4>
                    <p>La línea de base registró 37 especies de vertebrados terrestres. Se confirmó la presencia y población reproductiva de un reptil nativo clasificado <strong>En Peligro (EP)</strong> en 18 hectáreas del área directa del proyecto.</p>
                </div>

                <button class="btn-primary" onclick="completeAndNext(1)">Comprendo los antecedentes →</button>
            `;
            break;

        case 2:
            content.innerHTML = `
                <p>De acuerdo a la Ley 19.300 y el Reglamento del SEIA, determine si las características técnicas descritas obligan al proyecto a ingresar al sistema.</p>
                
                <div class="decision-grid">
                    <button class="btn-decision" onclick="answerStage2('no')">
                        <strong>✕ No ingresa al SEIA</strong>
                        <small>El proyecto no cumple las tipologías del Art. 10.</small>
                    </button>
                    <button class="btn-decision" onclick="answerStage2('yes')">
                        <strong>✓ Sí ingresa al SEIA</strong>
                        <small>Supera el umbral de potencia de centrales generadoras (>3MW).</small>
                    </button>
                </div>
                <div id="stage2Feedback"></div>
            `;
            break;

        case 3:
            content.innerHTML = `
                <p>El proyecto debe ingresar al SEIA. Ahora evalúe el instrumento adecuado: ¿Declaración de Impacto Ambiental (DIA) o Estudio de Impacto Ambiental (EIA)?</p>
                
                <div class="decision-grid">
                    <button class="btn-decision" onclick="answerStage3('dia')">
                        <strong>Declaración (DIA)</strong>
                        <small>Si no genera efectos adversos significativos del Art. 11.</small>
                    </button>
                    <button class="btn-decision" onclick="answerStage3('eia')">
                        <strong>Estudio (EIA)</strong>
                        <small>Si genera riesgo a especies amenazadas o hábitats relevantes.</small>
                    </button>
                </div>
                <div id="stage3Feedback"></div>
            `;
            break;

        default:
            content.innerHTML = `<p>Etapa ${id} en construcción técnica...</p>
            <button class="btn-primary" onclick="completeAndNext(${id})">Avanzar etapa →</button>`;
    }
}

// LOGICA DE DECISIONES
function answerStage2(option) {
    const feedback = document.getElementById("stage2Feedback");
    if (option === 'yes') {
        addScore(10, 'stage2');
        feedback.innerHTML = `
            <div class="feedback-box correct">
                <strong>✓ Correcto (+10 pts)</strong>
                <p>Las centrales generadoras de energía eléctrica con potencia mayor a 3 MW (Art. 3 letra c del RSEIA) deben ingresar obligatoriamente al SEIA.</p>
            </div>
            <button class="btn-primary" onclick="completeAndNext(2)">Siguiente Etapa →</button>
        `;
    } else {
        feedback.innerHTML = `
            <div class="feedback-box wrong">
                <strong>✕ Incorrecto</strong>
                <p>Revise la potencia del proyecto (82 MW). El umbral legal de ingreso es de 3 MW.</p>
            </div>
        `;
    }
}

function answerStage3(option) {
    const feedback = document.getElementById("stage3Feedback");
    if (option === 'eia') {
        addScore(15, 'stage3');
        feedback.innerHTML = `
            <div class="feedback-box correct">
                <strong>✓ Correcto (+15 pts)</strong>
                <p>Corresponde ingresar mediante un EIA debido a la afectación directa del hábitat de una especie en categoría En Peligro (Art. 11 letra b de la Ley 19.300).</p>
            </div>
            <button class="btn-primary" onclick="completeAndNext(3)">Siguiente Etapa →</button>
        `;
    } else {
        feedback.innerHTML = `
            <div class="feedback-box wrong">
                <strong>✕ Incorrecto</strong>
                <p>Una DIA no es suficiente cuando se afecta significativamente el hábitat de especies clasificadas en estado de conservación amenazado.</p>
            </div>
        `;
    }
}

function completeAndNext(stageId) {
    state.completedStages.add(stageId);
    if (stageId < stages.length) {
        goToStage(stageId + 1);
    } else {
        renderSidebar();
    }
}
</script>

</body>
</html>
