<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador SEIA - Revelación Progresiva</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA LATERAL (COLUMNA IZQUIERDA) */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-header {
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .progress-container {
            background-color: var(--bg-color);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Botón de etapa en menú lateral */
        .step-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            /* Animación al revelarse */
            animation: revealStep 0.35s ease-out forwards;
        }

        .step-item:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        .step-item.active {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        .step-item.completed {
            border-color: var(--success-color);
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .step-item.completed .step-number {
            background-color: var(--success-color);
            color: white;
        }

        .step-info {
            display: flex;
            flex-direction: column;
        }

        .step-phase {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
        }

        .step-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ÁREA PRINCIPAL DE CONTENIDO */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .top-bar {
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
        }

        .score-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .content-body {
            padding: 40px;
            overflow-y: auto;
            flex-grow: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .stage-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }

        .stage-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stage-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .option-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback-box.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .feedback-box.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        /* ANIMACIÓN DE FADE-IN */
        @keyframes revealStep {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- COLUMNA IZQUIERDA (BARRA LATERAL) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">Evaluación SEIA</h2>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <small id="stepCounter" style="color: var(--text-muted);">Etapa 1 de 13</small>
        </div>
        
        <!-- Aquí se cargan dinámicamente solo las etapas liberadas -->
        <div class="steps-list" id="sidebarSteps"></div>
    </aside>

    <!-- ÁREA DE CONTENIDO -->
    <main class="main-content">
        <header class="top-bar">
            <span id="currentPhaseLabel" style="font-weight: 600; color: var(--text-muted);">FASE SEIA</span>
            <div class="score-badge" id="scoreBadge">0 / 100 pts</div>
        </header>

        <section class="content-body" id="stageContent">
            <!-- El contenido dinámico de la etapa actual se renderiza aquí -->
        </section>
    </main>

    <script>
        // ESTADO GLOBAL
        const state = {
            currentStage: 1,
            maxUnlockedStage: 1, // Controla el avance en la barra lateral
            score: 0,
            completedStages: new Set(),
            awardedScores: new Set()
        };

        // ESTRUCTURA DE ETAPAS
        const stages = [
            { id: 1, title: "Antecedentes del Proyecto", phase: "SEIA", icon: "📄" },
            { id: 2, title: "¿Debe ingresar al SEIA?", phase: "SEIA", icon: "🔎" },
            { id: 3, title: "¿DIA o EIA?", phase: "SEIA", icon: "📑" },
            { id: 4, title: "Componente Fauna", phase: "SEIA", icon: "🦊" },
            { id: 5, title: "Impacto Ambiental", phase: "SEIA", icon: "📈" },
            { id: 6, title: "Línea de Base", phase: "SEIA", icon: "🔭" },
            { id: 7, title: "Normativa y PAS", phase: "SEIA", icon: "⚖️" },
            { id: 8, title: "Medidas Ambientales", phase: "SEIA", icon: "🌱" },
            { id: 9, title: "Pronunciamiento Técnico", phase: "SEIA", icon: "📋" },
            { id: 10, title: "Resolución RCA", phase: "RCA", icon: "✅" },
            { id: 11, title: "Construcción y Operación", phase: "SMA", icon: "🏗️" },
            { id: 12, title: "Fiscalización SMA", phase: "SMA", icon: "🔍" },
            { id: 13, title: "Cumplimiento y Hallazgos", phase: "SMA", icon: "⚠️" }
        ];

        // INICIALIZACIÓN
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadStage(1);
        });

        // DIBUJA LA COLUMNA IZQUIERDA OCULTANDO PASOS FUTUROS
        function renderSidebar() {
            const container = document.getElementById("sidebarSteps");
            
            // FILTRADO CLAVE: Solo genera los elementos hasta maxUnlockedStage
            const visibleStages = stages.filter(s => s.id <= state.maxUnlockedStage);

            container.innerHTML = visibleStages.map(s => {
                const isCompleted = state.completedStages.has(s.id);
                const isActive = s.id === state.currentStage;

                return `
                    <button class="step-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" 
                            onclick="goToStage(${s.id})">
                        <div class="step-number">${isCompleted ? '✓' : s.id}</div>
                        <div class="step-info">
                            <span class="step-phase">${s.phase}</span>
                            <span class="step-title">${s.title}</span>
                        </div>
                    </button>
                `;
            }).join('');

            // Actualizar interfaz general
            const progress = Math.round((state.completedStages.size / stages.length) * 100);
            document.getElementById("progressBar").style.width = `${progress}%`;
            document.getElementById("stepCounter").innerText = `Etapa ${state.currentStage} de ${stages.length}`;
            document.getElementById("scoreBadge").innerText = `${state.score} / 100 pts`;
        }

        function goToStage(stageId) {
            if (stageId <= state.maxUnlockedStage) {
                state.currentStage = stageId;
                renderSidebar();
                loadStage(stageId);
            }
        }

        // DESBLOQUEA LA SIGUIENTE ETAPA Y AVANZA
        function completeAndNext(stageId) {
            state.completedStages.add(stageId);

            // Se habilita la siguiente casilla en el menú lateral
            if (stageId + 1 > state.maxUnlockedStage && stageId < stages.length) {
                state.maxUnlockedStage = stageId + 1;
            }

            if (stageId < stages.length) {
                goToStage(stageId + 1);
            } else {
                renderSidebar();
            }
        }

        function addScore(points, key) {
            if (!state.awardedScores.has(key)) {
                state.score += points;
                state.awardedScores.add(key);
            }
        }

        // RENDERIZADOR DE CONTENIDO POR ETAPA
        function loadStage(stageId) {
            const container = document.getElementById("stageContent");
            const currentStageObj = stages.find(s => s.id === stageId);
            document.getElementById("currentPhaseLabel").innerText = `FASE ${currentStageObj.phase}`;

            switch (stageId) {
                case 1:
                    container.innerHTML = `
                        <div class="stage-card">
                            <h2 class="stage-title">📄 Antecedentes del Proyecto</h2>
                            <p class="stage-desc">
                                Se proyecta la construcción de un Parque Fotovoltaico con una potencia instalada de 12 MW y una línea de transmisión eléctrica de 3 km en la Región del Maule.
                            </p>
                            <button class="btn" onclick="addScore(10, 's1'); completeAndNext(1);">
                                Entendido, comenzar evaluación →
                            </button>
                        </div>
                    `;
                    break;

                case 2:
                    container.innerHTML = `
                        <div class="stage-card">
                            <h2 class="stage-title">🔎 ¿Debe ingresar al SEIA?</h2>
                            <p class="stage-desc">
                                Revisa el Artículo 10 de la Ley 19.300. Dado que el proyecto genera 12 MW (>3 MW) según el tipógrafo c), ¿corresponde su ingreso obligatorio al sistema?
                            </p>
                            <div class="options-grid">
                                <div class="option-card" onclick="evaluarIngreso(true)">
                                    <strong>Sí, debe ingresar obligatoriamente</strong>
                                    <p style="font-size:0.85rem; color:var(--text-muted); margin-top:5px;">Supera la tipología del Art. 10 letra c) al ser > 3MW.</p>
                                </div>
                                <div class="option-card" onclick="evaluarIngreso(false)">
                                    <strong>No, es de ingreso voluntario</strong>
                                    <p style="font-size:0.85rem; color:var(--text-muted); margin-top:5px;">Las energías renovables no requieren evaluación.</p>
                                </div>
                            </div>
                            <div id="feedback2" class="feedback-box"></div>
                        </div>
                    `;
                    break;

                case 3:
                    container.innerHTML = `
                        <div class="stage-card">
                            <h2 class="stage-title">📑 ¿DIA o EIA?</h2>
                            <p class="stage-desc">
                                El proyecto genera un riesgo para la salud de la población ni reasentamiento de comunidades, pero afectará el hábitat de una especie protegida (Art. 11 Ley 19.300).
                            </p>
                            <div class="options-grid">
                                <div class="option-card" onclick="evaluarVia('DIA')">
                                    <strong>Declaración de Impacto Ambiental (DIA)</strong>
                                </div>
                                <div class="option-card" onclick="evaluarVia('EIA')">
                                    <strong>Estudio de Impacto Ambiental (EIA)</strong>
                                </div>
                            </div>
                            <div id="feedback3" class="feedback-box"></div>
                        </div>
                    `;
                    break;

                default:
                    container.innerHTML = `
                        <div class="stage-card">
                            <h2 class="stage-title">${currentStageObj.icon} ${currentStageObj.title}</h2>
                            <p class="stage-desc">Contenido en desarrollo para la etapa ${stageId}.</p>
                            <button class="btn" onclick="completeAndNext(${stageId})">Siguiente Etapa →</button>
                        </div>
                    `;
                    break;
            }
        }

        // LÓGICA DE LAS PREGUNTAS
        function evaluarIngreso(esCorrecto) {
            const feedback = document.getElementById("feedback2");
            feedback.style.display = "block";

            if (esCorrecto) {
                feedback.className = "feedback-box success";
                feedback.innerHTML = `
                    <strong>¡Correcto! (+15 pts)</strong><br>
                    Al superar los 3 MW de potencia, ingresa obligatoriamente según el Art. 10 letra c).<br><br>
                    <button class="btn" onclick="completeAndNext(2)">Avanzar a la decisión DIA/EIA →</button>
                `;
                addScore(15, 's2');
            } else {
                feedback.className = "feedback-box error";
                feedback.innerHTML = "<strong>Incorrecto.</strong> Toda central generadora mayor a 3 MW debe ingresar obligatoriamente al SEIA.";
            }
        }

        function evaluarVia(opcion) {
            const feedback = document.getElementById("feedback3");
            feedback.style.display = "block";

            if (opcion === 'EIA') {
                feedback.className = "feedback-box success";
                feedback.innerHTML = `
                    <strong>¡Correcto! (+20 pts)</strong><br>
                    Al generar efectos significativos sobre la fauna protegida (Art. 11 letra b), el proyecto debe ingresar mediante un <strong>EIA</strong>.<br><br>
                    <button class="btn" onclick="completeAndNext(3)">Avanzar al Análisis de Fauna →</button>
                `;
                addScore(20, 's3');
            } else {
                feedback.className = "feedback-box error";
                feedback.innerHTML = "<strong>Incorrecto.</strong> Al haber un impacto significativo sobre flora o fauna protegida (Art. 11), una DIA no es suficiente.";
            }
        }
    </script>
</body>
</html>
